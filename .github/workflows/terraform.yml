name: Terraform Infrastructure

# Pull request       → Format + Validate + Plan
# Push to main       → Format + Validate + Plan
# Manual dispatch    → Plan, Apply, or Destroy
#
# Apply and Destroy are never automatic.

on:
  push:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches:
      - main
    paths:
      - "envs/dev/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm_destroy:
        description: "Type DESTROY to confirm destruction"
        required: false
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: eu-north-1

# Prevent simultaneous runs on the same branch.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # 1. TERRAFORM PLAN
  # --------------------------------------------------

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'destroy' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Check password without displaying the secret.
      - name: Validate Database Password
        env:
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          password = os.environ.get("DB_PASSWORD", "")

          if not password:
              print("ERROR: Database password is empty.")
              sys.exit(1)

          if any(ord(char) < 32 or ord(char) == 127 for char in password):
              print("ERROR: Database password contains control characters.")
              sys.exit(1)

          print("Database password validation passed.")
          PY

      - name: Terraform Init
        run: terraform -chdir=envs/dev init -input=false

      - name: Terraform Validate
        run: terraform -chdir=envs/dev validate -no-color

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          TF_VAR_github_org: ${{ vars.GH_ORG }}
        run: |
          terraform -chdir=envs/dev plan \
            -input=false \
            -out=tfplan \
            -no-color

      - name: Upload Terraform Plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: envs/dev/tfplan
          retention-days: 1

  # --------------------------------------------------
  # 2. TERRAFORM APPLY
  # --------------------------------------------------

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: plan

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' }}

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=envs/dev init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan
          path: envs/dev

      - name: Terraform Apply
        run: |
          terraform -chdir=envs/dev apply \
            -input=false \
            -auto-approve \
            -no-color \
            tfplan

  # --------------------------------------------------
  # 3. CHECK DESTROY CONFIRMATION
  # --------------------------------------------------

  validate_destroy:
    name: Confirm Terraform Destroy
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' }}

    steps:
      - name: Check confirmation
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM_DESTROY" != "DESTROY" ]; then
            echo "Destroy cancelled. You must type DESTROY exactly."
            exit 1
          fi

          echo "Destroy confirmation accepted."

  # --------------------------------------------------
  # 4. TERRAFORM DESTROY
  # --------------------------------------------------

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    needs: validate_destroy

    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm_destroy == 'DESTROY' }}

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform -chdir=envs/dev init -input=false

      - name: Terraform Destroy
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
          TF_VAR_github_org: ${{ vars.GH_ORG }}
        run: |
          terraform -chdir=envs/dev destroy \
            -input=false \
            -auto-approve \
            -no-color
